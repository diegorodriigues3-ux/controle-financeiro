<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financeira - Controle de Gastos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121214; color: #e1e1e6; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #29292e; padding-bottom: 15px; }
    h1 { color: #00b37e; font-size: 24px; }
    button { background: #00875f; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #00b37e; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: #202024; border-radius: 8px; padding: 20px; border: 1px solid #29292e; }
    .card h3 { font-size: 14px; color: #a8a8b3; margin-bottom: 10px; }
    .card .valor { font-size: 28px; font-weight: bold; color: #f75a68; }

    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    @media (max-width: 768px) { .content-grid { grid-template-columns: 1fr; } }
    
    .panel { background: #202024; border-radius: 8px; padding: 20px; border: 1px solid #29292e; }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #e1e1e6; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #29292e; font-size: 14px; }
    th { color: #a8a8b3; font-weight: normal; }
    td { color: #e1e1e6; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #29292e; color: #00b37e; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📊 Dashboard Financeira</h1>
      <button onclick="carregarDados()">🔄 Atualizar Dados</button>
    </header>

    <!-- Cards Superiores -->
    <div class="cards">
      <div class="card">
        <h3>TOTAL DE GASTOS</h3>
        <div class="valor" id="total-gastos">R$ 0,00</div>
      </div>
      <div class="card">
        <h3>QUANTIDADE DE LANÇAMENTOS</h3>
        <div class="valor" style="color: #00b37e;" id="total-itens">0</div>
      </div>
    </div>

    <!-- Gráficos e Tabelas -->
    <div class="content-grid">
      <!-- Painel do Gráfico -->
      <div class="panel">
        <h2>Gastos por Categoria</h2>
        <canvas id="chartCategorias" width="400" height="300"></canvas>
      </div>

      <!-- Painel da Tabela -->
      <div class="panel">
        <h2>Últimos Lançamentos</h2>
        <table>
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Forma</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="tabela-gastos">
            <tr><td colspan="4" style="text-align:center;">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://ugyrxgpffvrmzomldibk.supabase.co';
    const supabaseKey = 'sb_publishable_hoyDXLDegE51neY2E7e-FA_m8owsoDe';
    let meuGrafico = null;

    async function carregarDados() {
      try {
        const response = await fetch(`${supabaseUrl}/rest/v1/gastos?select=*&order=created_at.desc`, {
          headers: {
            'apikey': supabaseKey,
            'Authorization': `Bearer ${supabaseKey}`
          }
        });

        const gastos = await response.json();
        
        // 1. Atualizar Tabela e Totalizadores
        let total = 0;
        const tabela = document.getElementById('tabela-gastos');
        tabela.innerHTML = '';

        const categoriasMap = {};

        gastos.forEach(gasto => {
          total += Number(gasto.valor);

          // Agrupar por Categoria para o Gráfico
          if (categoriasMap[gasto.categoria]) {
            categoriasMap[gasto.categoria] += Number(gasto.valor);
          } else {
            categoriasMap[gasto.categoria] = Number(gasto.valor);
          }

          // Inserir linha na tabela
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${gasto.descricao}</strong></td>
            <td><span class="badge">${gasto.categoria}</span></td>
            <td>${gasto.forma_pagamento}</td>
            <td style="color: #f75a68; font-weight: bold;">R$ ${Number(gasto.valor).toFixed(2)}</td>
          `;
          tabela.appendChild(tr);
        });

        document.getElementById('total-gastos').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('total-itens').innerText = gastos.length;

        // 2. Gerar Gráfico
        renderizarGrafico(categoriasMap);

      } catch (err) {
        console.error("Erro ao buscar dados:", err);
      }
    }

    function renderizarGrafico(categoriasMap) {
      const ctx = document.getElementById('chartCategorias').getContext('2d');
      
      const labels = Object.keys(categoriasMap);
      const data = Object.values(categoriasMap);

      if (meuGrafico) {
        meuGrafico.destroy();
      }

      meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#00b37e', '#f75a68', '#00875f', '#ffb800', '#996dff'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#a8a8b3' } }
          }
        }
      });
    }

    // Carrega automaticamente ao abrir a página
    carregarDados();
  </script>

</body>
</html>
