<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceiraMente - Entrar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Verificação antecipada: se já estiver logado, pula direto para o painel
        const SUPABASE_URL = "https://ugyrxgpffvrmzomldibk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hoyDXLDeGE51ney2E7e-FA_m8owsM0";
        const supabaseTemp = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseTemp.auth.getSession().then(({ data: { session } }) => {
            if (session && session.user) {
                window.location.href = "/dashboard.html";
            }
        });
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <span class="text-4xl">🧠</span>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">FinanceiraMente</h1>
            <p class="text-xs text-slate-400">Faça login ou crie sua conta para acessar o controle financeiro</p>
        </div>

        <div id="mensagem-erro" class="hidden bg-rose-950/60 border border-rose-500/40 text-rose-300 text-xs p-3 rounded-lg text-center"></div>

        <form id="form-auth" onsubmit="realizarAcesso(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
                <input type="email5" id="input-email" required placeholder="seu@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-purple-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
                <input type="password" id="input-senha" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-purple-500 focus:outline-none">
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-3 rounded-lg transition shadow-lg cursor-pointer">
                Entrar
            </button>
        </form>

        <div class="text-center">
            <button type="button" onclick="alternarModo()" id="btn-alternar" class="text-xs text-purple-400 hover:text-purple-300 transition cursor-pointer">
                Não tem uma conta? Cadastre-se
            </button>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let modoCadastro = false;

        function alternarModo() {
            modoCadastro = !modoCadastro;
            const btnSubmit = document.getElementById("btn-submit");
            const btnAlternar = document.getElementById("btn-alternar");
            const erroDiv = document.getElementById("mensagem-erro");
            erroDiv.classList.add("hidden");

            if (modoCadastro) {
                btnSubmit.innerText = "Criar Conta";
                btnAlternar.innerText = "Já tem uma conta? Faça login";
            } else {
                btnSubmit.innerText = "Entrar";
                btnAlternar.innerText = "Não tem uma conta? Cadastre-se";
            }
        }

        async function realizarAcesso(event) {
            event.preventDefault();
            const email = document.getElementById("input-email").value;
            const senha = document.getElementById("input-senha").value;
            const erroDiv = document.getElementById("mensagem-erro");
            erroDiv.classList.add("hidden");

            if (modoCadastro) {
                const { data, error } = await db.auth.signUp({ email, senha });
                if (error) {
                    erroDiv.innerText = "Erro ao cadastrar: " + error.message;
                    erroDiv.classList.remove("hidden");
                } else {
                    alert("Conta criada com sucesso! Faça login para continuar.");
                    alternarModo();
                }
            } else {
                const { data, error } = await db.auth.signInWithPassword({ email, senha });
                if (error) {
                    erroDiv.innerText = "E-mail ou senha incorretos.";
                    erroDiv.classList.remove("hidden");
                } else {
                    window.location.href = "/dashboard.html";
                }
            }
        }
    </script>
</body>
</html>
