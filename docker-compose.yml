services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: evolution-api
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTH_GLOBAL_KEY=123456
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://evolution:evolution_password@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_MESSAGES=true
      - REDIS_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_instances: