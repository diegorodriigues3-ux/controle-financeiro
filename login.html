<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceiraMente - Entrar ou Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white transition-colors duration-200">

    <!-- Cabeçalho -->
    <header class="p-4 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 text-decoration-none">
                <span class="text-3xl">🧠</span>
                <span class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">FinanceiraMente</span>
            </a>
            <div class="flex items-center space-x-3">
                <!-- Botão de Alternar Tema -->
                <button onclick="alternarTema()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
                    <i id="icone-tema" class="fa-solid fa-moon text-sm"></i>
                </button>
                <a href="index.html" class="text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-purple-600 dark:hover:text-white transition flex items-center space-x-1">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Voltar ao Início</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Formulário de Login / Cadastro -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60 p-8 rounded-2xl shadow-lg w-full max-w-md space-y-6 transition-colors duration-200">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-purple-100 dark:bg-purple-900/60 text-2xl flex items-center justify-center rounded-2xl mx-auto mb-2">🧠</div>
                <h1 id="titulo-auth" class="text-2xl font-extrabold text-slate-900 dark:text-white">Acesse sua Conta</h1>
                <p id="sub-auth" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">Entre com seu e-mail e senha ou crie sua conta agora</p>
            </div>

            <!-- Botão de Login com Google -->
            <button type="button" onclick="loginComGoogle()" class="w-full bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-950 text-slate-700 dark:text-slate-200 font-medium py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 transition flex items-center justify-center space-x-3 cursor-pointer text-xs shadow-sm">
                <i class="fa-brands fa-google text-red-500 text-sm"></i>
                <span>Continuar com o Google</span>
            </button>

            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                <span class="px-3 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">ou com e-mail</span>
                <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
            </div>

            <!-- Formulário de E-mail e Senha -->
            <form id="form-auth" onsubmit="realizarAutenticacao(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-xs text-slate-800 dark:text-white focus:border-purple-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Senha</label>
                    <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-xs text-slate-800 dark:text-white focus:border-purple-500 focus:outline-none transition">
                </div>

                <div id="mensagem-erro" class="text-xs text-rose-500 text-center font-medium hidden bg-rose-50 dark:bg-rose-950/40 p-2.5 rounded-xl border border-rose-200 dark:border-rose-800"></div>

                <button type="submit" id="btn-submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold p-3 rounded-xl transition cursor-pointer shadow-md text-xs">
                    Entrar na Conta
                </button>
            </form>

            <!-- Alternar entre Login e Criar Conta -->
            <div class="text-center pt-2">
                <p class="text-xs text-slate-500 dark:text-slate-400">
                    <span id="texto-alternar">Não tem uma conta?</span> 
                    <button type="button" onclick="alternarModo()" id="link-alternar" class="text-purple-600 dark:text-purple-400 font-bold hover:underline ml-1 cursor-pointer">Criar conta grátis</button>
                </p>
            </div>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50">
        <p>© 2026 FinanceiraMente. Todos os direitos reservados.</p>
    </footer>

    <!-- Conexão e Lógica com o Supabase -->
    <script>
        const SUPABASE_URL = "https://ugyrxgpffvrmzomldibk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hoyDXLDegE51neY2E7e-FA_m8owsoDe";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let ehCadastro = false;

        // Alternar Tema Claro / Escuro
        function alternarTema() {
            const html = document.documentElement;
            const icone = document.getElementById('icone-tema');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icone.className = 'fa-solid fa-sun text-sm text-amber-500';
                localStorage.setItem('tema', 'light');
            } else {
                html.classList.add('dark');
                icone.className = 'fa-solid fa-moon text-sm';
                localStorage.setItem('tema', 'dark');
            }
        }

        // Carregar Tema Salvo
        if (localStorage.getItem('tema') === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('icone-tema').className = 'fa-solid fa-sun text-sm text-amber-500';
        }

        function alternarModo() {
            ehCadastro = !ehCadastro;
            const titulo = document.getElementById("titulo-auth");
            const sub = document.getElementById("sub-auth");
            const btn = document.getElementById("btn-submit");
            const txtAlt = document.getElementById("texto-alternar");
            const linkAlt = document.getElementById("link-alternar");
            const erroDiv = document.getElementById("mensagem-erro");

            erroDiv.classList.add("hidden");

            if (ehCadastro) {
                titulo.innerText = "Crie sua Conta";
                sub.innerText = "Preencha os dados abaixo para começar gratuitamente";
                btn.innerText = "Cadastrar Conta";
                txtAlt.innerText = "Já tem uma conta?";
                linkAlt.innerText = "Fazer login";
            } else {
                titulo.innerText = "Acesse sua Conta";
                sub.innerText = "Entre com seu e-mail e senha ou crie sua conta agora";
                btn.innerText = "Entrar na Conta";
                txtAlt.innerText = "Não tem uma conta?";
                linkAlt.innerText = "Criar conta grátis";
            }
        }

        async function realizarAutenticacao(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const erroDiv = document.getElementById("mensagem-erro");
            const btn = document.getElementById("btn-submit");

            erroDiv.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = "Processando...";

            try {
                if (ehCadastro) {
                    const { data, error } = await db.auth.signUp({ email, senha });
                    if (error) throw error;
                    alert("Conta criada com sucesso!");
                    alternarModo();
                } else {
                    const { data, error } = await db.auth.signInWithPassword({ email, senha });
                    if (error) throw error;
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                erroDiv.innerText = err.message || "Ocorreu um erro ao tentar autenticar.";
                erroDiv.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = ehCadastro ? "Cadastrar Conta" : "Entrar na Conta";
            }
        }

        async function loginComGoogle() {
            try {
                const { data, error } = await db.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/dashboard.html'
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert("Erro ao conectar com o Google: " + err.message);
            }
        }
    </script>
</body>
</html>
